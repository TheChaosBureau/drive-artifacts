name: Drive Artifacts
description: Store a GitHub Actions artifact in your own Google Drive, with the same inputs as actions/upload-artifact.
author: The Chaos Bureau
branding:
  icon: upload-cloud
  color: blue
inputs:
  name:
    description: Artifact name.
    default: artifact
  path:
    description: Files, directories or globs to upload, one per line. A leading "!" excludes.
    required: true
  token:
    description: The DRIVE_ARTIFACTS_TOKEN secret made by `drive-artifacts login`.
    required: true
  retention-days:
    description: Days until the artifact is trashed (1-400).
    default: "90"
  if-no-files-found:
    description: warn, error or ignore when nothing matches `path`.
    default: warn
  compression-level:
    description: Zip compression level, 0 (store) to 9.
    default: "6"
  overwrite:
    description: Replace an artifact of the same name in this run.
    default: "false"
  include-hidden-files:
    description: Include files and directories whose name starts with a dot.
    default: "false"
  root:
    description: Name of the root folder the app owns in your Drive.
    default: GitHub Artifacts
  prune:
    description: Trash this repository's expired artifacts after the upload.
    default: "true"
  latest:
    description: >-
      Store the one file `path` matches as a plain file at a fixed path and replace it in place
      on every upload: not zipped, no expiry, one Drive link that never changes. Runs only on
      the default branch. `name`, `retention-days`, `compression-level`, `overwrite` and `prune`
      do not apply.
    default: "false"
  latest-path:
    description: >-
      With `latest`: the path under the root folder; a trailing slash keeps the file's own name.
      Empty means Latest/<owner>/<repo>/<file name>.
    default: ""
  latest-any-ref:
    description: With `latest`, allow a ref that is not the default branch to replace the file.
    default: "false"
  source:
    description: The requirement uvx installs. Leave at the default.
    default: drive-artifacts==0.2.0
outputs:
  artifact-id:
    description: Drive file id of the uploaded zip, or of the latest file (it never changes).
    value: ${{ steps.upload.outputs.artifact-id }}
  artifact-url:
    description: Drive link to the uploaded zip, or to the latest file (it never changes).
    value: ${{ steps.upload.outputs.artifact-url }}
  artifact-digest:
    description: sha256 of the uploaded zip or latest file, prefixed `sha256:`.
    value: ${{ steps.upload.outputs.artifact-digest }}
  size:
    description: Size of the zip or latest file in bytes.
    value: ${{ steps.upload.outputs.size }}
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: false
    - id: upload
      shell: bash
      env:
        DRIVE_ARTIFACTS_TOKEN: ${{ inputs.token }}
        DRIVE_ARTIFACTS_ROOT: ${{ inputs.root }}
        DA_SOURCE: ${{ inputs.source }}
        DA_NAME: ${{ inputs.name }}
        DA_PATH: ${{ inputs.path }}
        DA_RETENTION_DAYS: ${{ inputs.retention-days }}
        DA_IF_NO_FILES_FOUND: ${{ inputs.if-no-files-found }}
        DA_COMPRESSION_LEVEL: ${{ inputs.compression-level }}
        DA_OVERWRITE: ${{ inputs.overwrite }}
        DA_INCLUDE_HIDDEN: ${{ inputs.include-hidden-files }}
        DA_PRUNE: ${{ inputs.prune }}
        DA_LATEST: ${{ inputs.latest }}
        DA_LATEST_PATH: ${{ inputs.latest-path }}
        DA_LATEST_ANY_REF: ${{ inputs.latest-any-ref }}
        PYTHONUTF8: "1" # a Windows console is not UTF-8; artifact names may be
      run: |
        # Workflow-command escaping, so an input value cannot end the line and start a command.
        esc() { local v=$1; v=${v//'%'/%25}; v=${v//$'\r'/%0D}; v=${v//$'\n'/%0A}; printf '%s' "$v"; }
        # Booleans as actions/upload-artifact reads them (YAML 1.2 core schema); anything else
        # fails. Every one is checked, whichever mode then uses it.
        bool() {
          case "$2" in
            true|True|TRUE) return 0 ;;
            false|False|FALSE) return 1 ;;
            *) echo "::error::$1 must be true or false, got '$(esc "$2")'"; exit 2 ;;
          esac
        }
        overwrite=false; hidden=false; prune=false; latest=false; any_ref=false
        if bool overwrite "$DA_OVERWRITE"; then overwrite=true; fi
        if bool include-hidden-files "$DA_INCLUDE_HIDDEN"; then hidden=true; fi
        if bool prune "$DA_PRUNE"; then prune=true; fi
        if bool latest "$DA_LATEST"; then latest=true; fi
        if bool latest-any-ref "$DA_LATEST_ANY_REF"; then any_ref=true; fi
        # `--option=value`, so a value that starts with a dash is never read as an option.
        args=(upload --path="$DA_PATH" --if-no-files-found="$DA_IF_NO_FILES_FOUND")
        if [ "$hidden" = true ]; then args+=(--include-hidden-files); fi
        if [ "$latest" = true ]; then
          # One plain file at a fixed path: the zip inputs have defaults, so they are left out
          # here rather than refused.
          args+=(--latest)
          if [ -n "$DA_LATEST_PATH" ]; then args+=(--latest-path="$DA_LATEST_PATH"); fi
          if [ "$any_ref" = true ]; then args+=(--any-ref); fi
        else
          if [ -n "$DA_LATEST_PATH" ] || [ "$any_ref" = true ]; then
            echo "::error::latest-path and latest-any-ref need latest: true"; exit 2
          fi
          args+=(--name="$DA_NAME" --retention-days="$DA_RETENTION_DAYS"
                 --compression-level="$DA_COMPRESSION_LEVEL")
          if [ "$overwrite" = true ]; then args+=(--overwrite); fi
          if [ "$prune" = false ]; then args+=(--no-prune); fi
        fi
        # --no-config: the calling repository's uv.toml must not change how this installs.
        uvx --no-config --from "$DA_SOURCE" drive-artifacts "${args[@]}"

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
      - id: zizmor
        name: zizmor
        entry: uv run zizmor --min-severity low .github/workflows action.yml download/action.yml
        language: system
        pass_filenames: false
        files: ^(\.github/|action\.yml|download/action\.yml)

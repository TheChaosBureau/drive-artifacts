name: codeql
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "33 5 * * 1"
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the results to code scanning
      contents: read
      actions: read # the analyze step reads its own workflow run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@3ea37a44b6e4e6847c46edae209410d258d548d1 # v4.38.3
        with:
          languages: python, actions
      - uses: github/codeql-action/analyze@776237d428f23fefc3d9e0fe1962921cbcd53e17 # v4.38.3

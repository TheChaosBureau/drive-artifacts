name: ci
on:
  push:
    branches: [main]
  pull_request:
    # `labeled`/`unlabeled` re-run the changelog gate when `skip-changelog` is added or removed.
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv lock --check
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pyright
      - run: uv run zizmor --min-severity low .github/workflows action.yml download/action.yml
      - run: uv run actionlint
      # Audit the locked third-party set. Auditing the live environment would also try the
      # project itself, which is not on PyPI, and `--strict` turns that into a failure.
      - run: uv export --quiet --frozen --all-groups --no-emit-project --output-file "$RUNNER_TEMP/requirements.txt"
      - run: uv run pip-audit --strict --disable-pip --requirement "$RUNNER_TEMP/requirements.txt"
  changelog:
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE...$HEAD")
          if echo "$changed" | grep -q '^src/' && ! echo "$changed" | grep -q '^CHANGELOG.md$'; then
            echo "::error::src/ changed but CHANGELOG.md did not (add the skip-changelog label to override)"
            exit 1
          fi
  test:
    needs: static
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      # Only what the suite needs: the linters stay out of the test legs.
      - run: uv sync --no-default-groups --group test
      - run: uv run --no-sync pytest --cov --cov-report=term --cov-report=xml -m "not contract"
  test-cross:
    needs: static
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      # Only what the suite needs: the linters stay out of the test legs.
      - run: uv sync --no-default-groups --group test
      - run: uv run --no-sync pytest --cov --cov-report=term --cov-report=xml -m "not contract"
